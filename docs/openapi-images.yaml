      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images Sourcing Kit
      x-api-token-group:
      - Images Read
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images.import.sources
      x-fern-sdk-method-name: check
  /accounts/{account_id}/images/v2/sourcingkit/sources/connectivity-precheck:
    post:
      operationId: cloudflare-images-sourcingkit-precheck-source-connectivity
      summary: Precheck source connectivity
      description: Check S3 credentials without saving a source.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/images_sourcingkit_connectivity_precheck_request'
      responses:
        '200':
          description: Connectivity precheck response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_sourcingkit_connectivity_check_response'
        4XX:
          description: Connectivity precheck response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_sourcingkit_connectivity_check_response'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images Sourcing Kit
      x-api-token-group:
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images.import.sources
      x-fern-sdk-method-name: pre-check
components:
  schemas:
    images_account_identifier:
      description: Account identifier tag.
      type: string
      example: 023e105f4ecef8ad9ca31a8372d0c353
      maxLength: 32
      readOnly: true
      x-auditable: true
    images_api-response-collection-v2:
      type: object
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            type: object
            properties:
              continuation_token:
                $ref: '#/components/schemas/images_images_list_continuation_token'
        type: object
    images_api-response-common:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/images_messages'
        messages:
          $ref: '#/components/schemas/images_messages'
        result:
          anyOf:
          - type: object
          - items:
              type: object
            type: array
          - type: string
        success:
          description: Whether the API call was successful
          type: boolean
          example: true
          enum:
          - true
          x-auditable: true
      required:
      - success
      - errors
      - messages
      - result
    images_api-response-common-failure:
      type: object
      properties:
        errors:
          example:
          - code: 7003
            message: No route for the URI
          allOf:
          - $ref: '#/components/schemas/images_messages'
          minItems: 1
        messages:
          example: []
          allOf:
          - $ref: '#/components/schemas/images_messages'
        result:
          type: object
          enum:
          - null
          nullable: true
        success:
          description: Whether the API call was successful
          type: boolean
          example: false
          enum:
          - false
          x-auditable: true
      required:
      - success
      - errors
      - messages
      - result
    images_api-response-single:
      type: object
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            anyOf:
            - type: object
            - type: string
        type: object
    images_deleted_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            type: object
            example: {}
        type: object
    images_image:
      type: object
      properties:
        creator:
          $ref: '#/components/schemas/images_image_creator'
        filename:
          $ref: '#/components/schemas/images_image_filename'
        id:
          $ref: '#/components/schemas/images_image_identifier'
        meta:
          $ref: '#/components/schemas/images_image_metadata'
        requireSignedURLs:
          $ref: '#/components/schemas/images_image_requireSignedURLs'
        uploaded:
          $ref: '#/components/schemas/images_image_uploaded'
        variants:
          $ref: '#/components/schemas/images_image_variants'
    images_image_basic_upload:
      type: object
      properties:
        creator:
          description: Can set the creator field with an internal user ID.
          type: string
          maxLength: 1024
        file:
          description: An image binary data. Only needed when type is uploading a file.
          type: string
          format: binary
          x-auditable: true
        id:
          description: An optional custom unique identifier for your image.
          type: string
          x-auditable: true
        metadata:
          description: User modifiable key-value store. Can use used for keeping references to another system of record for
            managing images.
          type: object
        requireSignedURLs:
          description: Indicates whether the image requires a signature token for the access.
          type: boolean
          example: true
          default: false
          x-auditable: true
        url:
          description: A URL to fetch an image from origin. Only needed when type is uploading from a URL.
          type: string
          example: https://example.com/path/to/logo.png
          x-auditable: true
    images_image_creator:
      description: Can set the creator field with an internal user ID.
      type: string
      example: 107b9558-dd06-4bbd-5fef-9c2c16bb7900
      maxLength: 1024
      nullable: true
      x-auditable: true
    images_image_direct_upload_request_v1:
      type: object
      properties:
        expiry:
          description: 'The date after which the upload will not be accepted. Minimum: Now + 2 minutes. Maximum: Now + 6 hours.'
          type: string
          format: date-time
          example: 2021-01-02 02:20:00+00:00
    images_image_direct_upload_request_v2:
      type: object
      properties:
        creator:
          description: Can set the creator field with an internal user ID.
          type: string
        expiry:
          description: 'The date after which the upload will not be accepted. Minimum: Now + 2 minutes. Maximum: Now + 6 hours.'
          type: string
          format: date-time
          example: 2021-01-02 02:20:00+00:00
          default: Now + 30 minutes
          x-auditable: true
        id:
          description: Optional Image Custom ID. Up to 1024 chars. Can include any number of subpaths, and utf8 characters.
            Cannot start nor end with a / (forward slash). Cannot be a UUID.
          type: string
          example: this/is/my-customid
          maxLength: 1024
          x-auditable: true
        metadata:
          description: User modifiable key-value store. Can be used for keeping references to another system of record, for
            managing images.
          type: object
        requireSignedURLs:
          description: Indicates whether the image requires a signature token to be accessed.
          type: boolean
          example: true
          default: false
          x-auditable: true
    images_image_direct_upload_response_v1:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            type: object
            properties:
              id:
                description: Image unique identifier.
                type: string
                example: e22e9e6b-c02b-42fd-c405-6c32af5fe600
                readOnly: true
              uploadURL:
                description: The URL the unauthenticated upload can be performed to using a single HTTP POST (multipart/form-data)
                  request.
                type: string
                example: https://upload.imagedelivery.net/FxUufywByo0m2v3xhKSiU8/e22e9e6b-c02b-42fd-c405-6c32af5fe600
        type: object
    images_image_direct_upload_response_v2:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            type: object
            properties:
              id:
                description: Image unique identifier.
                type: string
                example: e22e9e6b-c02b-42fd-c405-6c32af5fe600
                maxLength: 32
                readOnly: true
                x-auditable: true
              uploadURL:
                description: The URL the unauthenticated upload can be performed to using a single HTTP POST (multipart/form-data)
                  request.
                type: string
                example: https://upload.imagedelivery.net/FxUufywByo0m2v3xhKSiU8/e22e9e6b-c02b-42fd-c405-6c32af5fe600
                x-auditable: true
        type: object
    images_image_filename:
      description: Image file name.
      type: string
      example: logo.png
      maxLength: 255
      readOnly: true
      x-auditable: true
    images_image_hero_url:
      description: URI to hero variant for an image.
      type: string
      format: uri
      example: https://imagedelivery.net/MTt4OTd0b0w5aj/107b9558-dd06-4bbd-5fef-9c2c16bb7900/hero
      readOnly: true
      x-auditable: true
    images_image_identifier:
      description: Image unique identifier.
      type: string
      example: 107b9558-dd06-4bbd-5fef-9c2c16bb7900
      maxLength: 32
      readOnly: true
      x-auditable: true
    images_image_key_name:
      description: Key name.
      type: string
      example: default
      readOnly: true
      x-auditable: true
    images_image_key_response_collection:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/images_image_keys_response'
        type: object
    images_image_key_value:
      description: Key value.
      type: string
      example: Oix0bbNaT8Rge9PuyxUBrjI6zrgnsyJ5=
      readOnly: true
      x-auditable: true
    images_image_keys:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/images_image_key_name'
        value:
          $ref: '#/components/schemas/images_image_key_value'
    images_image_keys_response:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/images_image_keys'
    images_image_metadata:
      description: User modifiable key-value store. Can be used for keeping references to another system of record for managing
        images. Metadata must not exceed 1024 bytes.
      type: object
      example:
        key: value
    images_image_original_url:
      description: URI to original variant for an image.
      type: string
      format: uri
      example: https://imagedelivery.net/MTt4OTd0b0w5aj/107b9558-dd06-4bbd-5fef-9c2c16bb7900/original
      readOnly: true
      x-auditable: true
    images_image_patch_request:
      type: object
      properties:
        creator:
          description: Can set the creator field with an internal user ID.
          type: string
        metadata:
          description: User modifiable key-value store. Can be used for keeping references to another system of record for
            managing images. No change if not specified.
          type: object
        requireSignedURLs:
          description: Indicates whether the image can be accessed using only its UID. If set to `true`, a signed token needs
            to be generated with a signing key to view the image. Returns a new UID on a change. No change if not specified.
          type: boolean
          example: true
          x-auditable: true
    images_image_requireSignedURLs:
      description: Indicates whether the image can be a accessed only using it's UID. If set to true, a signed token needs
        to be generated with a signing key to view the image.
      type: boolean
      example: true
      default: false
      x-auditable: true
    images_image_response_blob:
      example: <image blob data>
      anyOf:
      - type: string
      - type: object
    images_image_response_single:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_image'
        type: object
    images_image_thumbnail_url:
      description: URI to thumbnail variant for an image.
      type: string
      format: uri
      example: https://imagedelivery.net/MTt4OTd0b0w5aj/107b9558-dd06-4bbd-5fef-9c2c16bb7900/thumbnail
      readOnly: true
      x-auditable: true
    images_image_uploaded:
      description: When the media item was uploaded.
      type: string
      format: date-time
      example: 2014-01-02 02:20:00.123000+00:00
      readOnly: true
      x-auditable: true
    images_image_variant_definition:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/images_image_variant_identifier'
        neverRequireSignedURLs:
          $ref: '#/components/schemas/images_image_variant_neverRequireSignedURLs'
        options:
          $ref: '#/components/schemas/images_image_variant_options'
      required:
      - id
      - options
    images_image_variant_fit:
      description: The fit property describes how the width and height dimensions should be interpreted.
      type: string
      example: scale-down
      enum:
      - scale-down
      - contain
      - cover
      - crop
      - pad
      x-auditable: true
    images_image_variant_flat_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_image_variant_definition'
        type: object
    images_image_variant_height:
      description: Maximum height in image pixels.
      type: number
      example: 768
      minimum: 1
      x-auditable: true
    images_image_variant_identifier:
      type: string
      example: hero
      maxLength: 99
      pattern: ^[a-zA-Z0-9]+$
      x-auditable: true
    images_image_variant_list_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            $ref: '#/components/schemas/images_image_variants_response'
        type: object
    images_image_variant_neverRequireSignedURLs:
      description: Indicates whether the variant can access an image without a signature, regardless of image access control.
      type: boolean
      example: true
      default: false
      x-auditable: true
    images_image_variant_options:
      description: Allows you to define image resizing sizes for different use cases.
      type: object
      properties:
        fit:
          $ref: '#/components/schemas/images_image_variant_fit'
        height:
          $ref: '#/components/schemas/images_image_variant_height'
        metadata:
          $ref: '#/components/schemas/images_image_variant_schemas_metadata'
        width:
          $ref: '#/components/schemas/images_image_variant_width'
      required:
      - fit
      - metadata
      - width
      - height
    images_image_variant_patch_request:
      type: object
      properties:
        neverRequireSignedURLs:
          $ref: '#/components/schemas/images_image_variant_neverRequireSignedURLs'
        options:
          $ref: '#/components/schemas/images_image_variant_options'
      required:
      - options
    images_image_variant_public_request:
      type: object
      properties:
        hero:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/images_image_variant_identifier'
            neverRequireSignedURLs:
              $ref: '#/components/schemas/images_image_variant_neverRequireSignedURLs'
            options:
              $ref: '#/components/schemas/images_image_variant_options'
          required:
          - id
          - options
    images_image_variant_response:
      type: object
      properties:
        variant:
          $ref: '#/components/schemas/images_image_variant_definition'
    images_image_variant_schemas_metadata:
      description: What EXIF data should be preserved in the output image.
      type: string
      example: none
      enum:
      - keep
      - copyright
      - none
      x-auditable: true
    images_image_variant_simple_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_image_variant_response'
        type: object
    images_image_variant_width:
      description: Maximum width in image pixels.
      type: number
      example: 1366
      minimum: 1
      x-auditable: true
    images_image_variants:
      description: Object specifying available variants for an image.
      type: array
      items:
        anyOf:
        - $ref: '#/components/schemas/images_image_thumbnail_url'
        - $ref: '#/components/schemas/images_image_hero_url'
        - $ref: '#/components/schemas/images_image_original_url'
      example:
      - https://imagedelivery.net/MTt4OTd0b0w5aj/107b9558-dd06-4bbd-5fef-9c2c16bb7900/thumbnail
      - https://imagedelivery.net/MTt4OTd0b0w5aj/107b9558-dd06-4bbd-5fef-9c2c16bb7900/hero
      - https://imagedelivery.net/MTt4OTd0b0w5aj/107b9558-dd06-4bbd-5fef-9c2c16bb7900/original
      readOnly: true
    images_image_variants_response:
      type: object
      properties:
        variants:
          $ref: '#/components/schemas/images_image_variant_public_request'
    images_images_list_continuation_token:
      description: Continuation token to fetch next page. Passed as a query param when requesting List V2 api endpoint.
      type: string
      example: iD0bxlWFSVUWsDHbzIqvDkgBW4otifAAuGXLz1n8BQA
      maxLength: 32
      nullable: true
      readOnly: true
      x-auditable: true
    images_images_list_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            type: object
            properties:
              images:
                type: array
                items:
                  $ref: '#/components/schemas/images_image'
        type: object
    images_images_list_response_v2:
      allOf:
      - $ref: '#/components/schemas/images_api-response-collection-v2'
      - properties:
          result:
            type: object
            properties:
              images:
                type: array
                items:
                  $ref: '#/components/schemas/images_image'
        type: object
    images_images_stats:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/images_images_stats_count'
    images_images_stats_allowed:
      description: Cloudflare Images allowed usage.
      type: number
      example: 100000
      readOnly: true
      x-auditable: true
    images_images_stats_count:
      type: object
      properties:
        allowed:
          $ref: '#/components/schemas/images_images_stats_allowed'
        current:
          $ref: '#/components/schemas/images_images_stats_current'
    images_images_stats_current:
      description: Cloudflare Images current usage.
      type: number
      example: 1000
      readOnly: true
      x-auditable: true
    images_images_stats_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_images_stats'
        type: object
    images_messages:
      type: array
      items:
        properties:
          code:
            type: integer
            minimum: 1000
            x-auditable: true
          message:
            type: string
            x-auditable: true
        required:
        - code
        - message
        type: object
        uniqueItems: true
      example: []
    images_metadata_keys_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            type: object
            properties:
              keys:
                type: array
                items:
                  maxLength: 100
                  type: string
                maxItems: 1000
              truncated:
                type: boolean
            required:
            - keys
            - truncated
        type: object
    images_signing_key_identifier:
      type: string
      example: someKey
      maxLength: 20
      pattern: ^[a-zA-Z0-9]+$
      x-auditable: true
    images_sourcingkit_acceptable_content_type:
      description: A MIME type that can be excluded from migration.
      type: string
      enum:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - image/avif
      - image/heic
      - image/svg+xml
    images_sourcingkit_conflict_behaviour:
      description: How to handle objects that already exist at the destination.
      type: string
      default: skip
      enum:
      - skip
      - overwrite
    images_sourcingkit_connectivity_check_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            type: object
            properties:
              code:
                description: Machine-readable error code if connectivity failed.
                type: string
                nullable: true
              connectivityStatus:
                description: Whether the connectivity check succeeded.
                type: string
                enum:
                - ok
                - error
              reason:
                description: Human-readable error description if connectivity failed.
                type: string
                nullable: true
        type: object
    images_sourcingkit_connectivity_precheck_request:
      type: object
      properties:
        account:
          description: Account identifier for the bucket (required for R2 vendor).
          type: string
        bucket:
          description: The name of the storage bucket.
          type: string
          maxLength: 128
          minLength: 1
        region:
          description: The region hint for the bucket (S3 only).
          type: string
          nullable: true
        secret:
          description: Storage credentials for accessing the bucket.
          type: object
          writeOnly: true
        vendor:
          $ref: '#/components/schemas/images_sourcingkit_vendor'
      required:
      - bucket
      - vendor
      - secret
    images_sourcingkit_identifier:
      description: Sourcing kit resource identifier.
      type: string
      format: uuid
      example: 5ca167e6-4e40-4ced-a209-ca1b9dd6a265
    images_sourcingkit_migration:
      type: object
      properties:
        conflictBehaviour:
          $ref: '#/components/schemas/images_sourcingkit_conflict_behaviour'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        endedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        excludedContentTypes:
          description: Content types to skip during migration.
          type: array
          items:
            $ref: '#/components/schemas/images_sourcingkit_acceptable_content_type'
          nullable: true
        id:
          description: Migration unique identifier.
          type: string
          format: uuid
          readOnly: true
        imagesPathPrefix:
          description: Alias for pathPrefix (deprecated).
          type: string
          nullable: true
        logStopped:
          description: Whether logging was stopped due to excessive log volume.
          type: boolean
          readOnly: true
        pathPrefix:
          description: Prefix to prepend to image custom IDs.
          type: string
          nullable: true
        rootDirectory:
          description: Only import objects under this prefix in the source bucket.
          type: string
          nullable: true
        sourceId:
          description: The source this migration imports from.
          type: string
          format: uuid
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        status:
          $ref: '#/components/schemas/images_sourcingkit_migration_status'
    images_sourcingkit_migration_create_request:
      type: object
      properties:
        conflictBehaviour:
          $ref: '#/components/schemas/images_sourcingkit_conflict_behaviour'
        excludedContentTypes:
          description: Content types to skip during migration.
          type: array
          items:
            $ref: '#/components/schemas/images_sourcingkit_acceptable_content_type'
        pathPrefix:
          description: Prefix to prepend to image custom IDs.
          type: string
          maxLength: 128
          minLength: 1
        rootDirectory:
          description: Only import objects under this prefix in the source bucket.
          type: string
          maxLength: 128
          minLength: 1
        sourceId:
          description: The identifier of the source to migrate from.
          type: string
          format: uuid
      required:
      - sourceId
    images_sourcingkit_migration_create_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_sourcingkit_migration'
        type: object
    images_sourcingkit_migration_list_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            type: object
            properties:
              migrations:
                type: array
                items:
                  $ref: '#/components/schemas/images_sourcingkit_migration'
        type: object
    images_sourcingkit_migration_log:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          nullable: true
        logType:
          $ref: '#/components/schemas/images_sourcingkit_migration_log_type'
        msg:
          description: Log message detail.
          type: string
          nullable: true
    images_sourcingkit_migration_log_list_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            type: object
            properties:
              logs:
                type: array
                items:
                  $ref: '#/components/schemas/images_sourcingkit_migration_log'
        type: object
    images_sourcingkit_migration_log_type:
      description: The type of log entry.
      type: string
      enum:
      - default
      - importSkippedUnsupportedContentType
      - importSkippedExcludedContentType
      - importSkippedInvalidMedia
      - importErrorRetryExhaustion
      - importSkippedOversized
      - migrationErrorFailedContinuation
      - migrationStart
      - migrationAbort
      - migrationError
      - migrationComplete
      - importSkippedStorageClass
    images_sourcingkit_migration_progress_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            type: object
            properties:
              endedAt:
                type: string
                format: date-time
                nullable: true
              importErrorsCount:
                description: Objects that failed to import.
                type: integer
              importSuccessCount:
                description: Objects successfully imported.
                type: integer
              isAccurate:
                description: Whether the counts are accurate or estimated.
                type: boolean
              scannedCount:
                description: Total number of objects scanned in the source.
                type: integer
              skippedConflictCount:
                description: Objects skipped due to existing images at destination.
                type: integer
              skippedExcludedContentTypeCount:
                description: Objects skipped because their content type was excluded.
                type: integer
              skippedInvalidMediaCount:
                description: Objects skipped because the media could not be decoded.
                type: integer
              skippedInvalidNameCount:
                description: Objects skipped because their name is not valid.
                type: integer
              skippedOversizeCount:
                description: Objects skipped because they exceed the size limit.
                type: integer
              skippedStorageClassCount:
                description: Objects skipped due to unsupported storage class.
                type: integer
              skippedUnsupportedContentTypeCount:
                description: Objects skipped because their content type is not supported.
                type: integer
              startedAt:
                type: string
                format: date-time
                nullable: true
              status:
                $ref: '#/components/schemas/images_sourcingkit_migration_status'
        type: object
    images_sourcingkit_migration_single_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_sourcingkit_migration'
        type: object
    images_sourcingkit_migration_status:
      description: Current status of the migration.
      type: string
      enum:
      - pending
      - processing
      - success
      - error
      - aborted
    images_sourcingkit_source:
      type: object
      properties:
        bucket:
          description: The name of the storage bucket.
          type: string
          example: my-images-bucket
        createdAt:
          description: When the source was created.
          type: string
          format: date-time
          readOnly: true
        id:
          description: Source unique identifier.
          type: string
          format: uuid
          example: 5ca167e6-4e40-4ced-a209-ca1b9dd6a265
          readOnly: true
        name:
          description: A human-readable name for the source.
          type: string
          example: my-s3-bucket
        region:
          description: The region of the storage bucket (S3 sources only).
          type: string
          example: us-east-1
          nullable: true
        updatedAt:
          description: When the source was last updated.
          type: string
          format: date-time
          readOnly: true
        vendor:
          $ref: '#/components/schemas/images_sourcingkit_vendor'
    images_sourcingkit_source_create_request:
      type: object
      properties:
        account:
          description: Account identifier for the bucket (required for R2 vendor).
          type: string
        bucket:
          description: The name of the storage bucket.
          type: string
          example: my-images-bucket
          maxLength: 128
          minLength: 1
        name:
          description: A human-readable name for the source.
          type: string
          example: my-s3-bucket
          maxLength: 128
          minLength: 1
        secret:
          description: Storage credentials for accessing the bucket. Shape depends on vendor.
          type: object
          writeOnly: true
        vendor:
          $ref: '#/components/schemas/images_sourcingkit_vendor'
      required:
      - name
      - bucket
      - vendor
      - secret
    images_sourcingkit_source_create_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_sourcingkit_source'
        type: object
    images_sourcingkit_source_list_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-common'
      - properties:
          result:
            type: object
            properties:
              sources:
                type: array
                items:
                  $ref: '#/components/schemas/images_sourcingkit_source'
        type: object
    images_sourcingkit_source_single_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_sourcingkit_source'
        type: object
    images_sourcingkit_source_update_request:
      type: object
      properties:
        name:
          description: Updated name for the source.
          type: string
          example: my-renamed-bucket
          maxLength: 128
          minLength: 1
      required:
      - name
    images_sourcingkit_source_update_response:
      allOf:
      - $ref: '#/components/schemas/images_api-response-single'
      - properties:
          result:
            $ref: '#/components/schemas/images_sourcingkit_source'
        type: object
    images_sourcingkit_vendor:
      description: The cloud storage vendor of the source bucket.
      type: string
      example: s3
      enum:
      - s3
      - r2
