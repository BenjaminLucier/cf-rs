      x-fern-sdk-group-name: images.keys
      x-fern-sdk-method-name: list
  /accounts/{account_id}/images/v1/keys/{signing_key_name}:
    delete:
      operationId: cloudflare-images-keys-delete-signing-key
      summary: Delete Signing Key
      description: 'Delete a CF Images signing key with specified name. Returns all keys available.

        When the last key is removed, a new default signing key will be generated.

        '
      parameters:
      - name: signing_key_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_signing_key_identifier'
      - name: account_id
        in: path
        required: true
