      - name: continuation_token
        in: query
        schema:
          $ref: '#/components/schemas/images_images_list_continuation_token'
      - name: per_page
        in: query
        schema:
          description: Number of items per page
          type: number
          default: 1000
          maximum: 10000
          minimum: 10
      - name: sort_order
        in: query
        schema:
          description: Sorting order by upload time
          type: string
          default: desc
          enum:
          - asc
          - desc
      - name: creator
        in: query
        schema:
          description: Internal user ID set within the creator field. Setting to empty string "" will return images where
            creator field is not set
          type: string
          nullable: true
      - name: meta.<field>[<operator>]
        in: query
        description: 'Optional metadata filter(s). Multiple filters can be combined with AND logic.


          **Operators:**

          - `eq`, `eq:string`, `eq:number`, `eq:boolean` - Exact match

          - `gt`, `gt:number` - Greater than (number only)

          - `gte`, `gte:number` - Greater than or equal (number only)

          - `lt`, `lt:number` - Less than (number only)

          - `lte`, `lte:number` - Less than or equal (number only)

          - `in`, `in:string`, `in:number` - Match any value in pipe-separated list


          **Examples:**

          - `meta.status[eq]=active`

          - `meta.priority[eq:number]=5`

          - `meta.enabled[eq:boolean]=true`

          - `meta.priority[gte:number]=1`

          - `meta.score[lt:number]=100`

          - `meta.region[in]=us-east|us-west|eu-west`


          **Note:** Filter consistency is not validated. Contradictory filters (e.g., `meta.priority[eq:number]=5&meta.priority[lte:number]=3`)
          will return zero results.

          '
        schema:
          type: string
        explode: true
        style: form
      responses:
        '200':
