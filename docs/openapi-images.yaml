openapi: 3.0.3
info:
  title: Cloudflare API (Images subset)
  version: 4.0.0
servers:
- description: Client API
  url: https://api.cloudflare.com/client/v4
paths:
  /accounts/{account_id}/images/v1:
    get:
      operationId: cloudflare-images-list-images
      summary: List images
      description: List up to 100 images with one request. Use the optional parameters below to get a specific range of images.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      - name: page
        in: query
        schema:
          description: Page number of paginated results.
          type: number
          default: 1
          minimum: 1
      - name: per_page
        in: query
        schema:
          description: Number of items per page.
          type: number
          default: 1000
          maximum: 10000
          minimum: 10
      - name: creator
        in: query
        schema:
          description: Internal user ID set within the creator field. Setting to empty string "" will return images where
            creator field is not set
          type: string
          nullable: true
      responses:
        '200':
          description: List images response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_images_list_response'
        4XX:
          description: List images response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_images_list_response'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Read
      - Images Write
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: images.v1
      x-fern-sdk-method-name: list
    post:
      operationId: cloudflare-images-upload-an-image-via-url
      summary: Upload an image
      description: 'Upload an image to CF Images. Images up to 10 Megabytes can be uploaded using a

        single HTTP POST (multipart/form-data) request by sending an image file or

        passing a URL accessible to the API.

        '
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/images_image_basic_upload'
      responses:
        '200':
          description: Upload an image response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_image_response_single'
        4XX:
          description: Upload an image response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_response_single'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images
      x-fern-sdk-method-name: create
  /accounts/{account_id}/images/v1/{image_id}:
    delete:
      operationId: cloudflare-images-delete-image
      summary: Delete image
      description: Delete an image on Cloudflare Images. On success, all copies of the image are deleted and purged from cache.
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_image_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      responses:
        '200':
          description: Delete image response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_deleted_response'
        4XX:
          description: Delete image response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_deleted_response'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation will delete this image.
    get:
      operationId: cloudflare-images-image-details
      summary: Image details
      description: Fetch details for a CF Images image.
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_image_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      responses:
        '200':
          description: Image details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_image_response_single'
        4XX:
          description: Image details response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_response_single'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Read
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images
      x-fern-sdk-method-name: get
    patch:
      operationId: cloudflare-images-update-image
      summary: Update image
      description: Update a CF Images image's metadata, creator, or access control. On access control change, all copies of
        the image are purged from cache.
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_image_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/images_image_patch_request'
      responses:
        '200':
          description: Update image response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_image_response_single'
        4XX:
          description: Update image response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_response_single'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images
      x-fern-sdk-method-name: edit
  /accounts/{account_id}/images/v1/{image_id}/blob:
    get:
      operationId: cloudflare-images-base-image
      summary: Download image
      description: Download an image from CF Images. For most images this will be the originally uploaded file. For larger
        images it can be a near-lossless version of the original.
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_image_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      responses:
        '200':
          description: Base image response. Returns uploaded image data.
          content:
            image/*:
              schema:
                type: string
                format: binary
        4XX:
          description: Base image response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_response_blob'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Read
      - Images Write
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images
      x-fern-sdk-method-name: get-blob
  /accounts/{account_id}/images/v1/direct_upload:
    post:
      operationId: cloudflare-images-create-authenticated-direct-upload-url-v-1
      summary: Create authenticated direct upload URL V1
      description: 'Direct uploads allow users to upload images without API keys. A common use

        case are web apps, client-side applications, or mobile devices where users

        upload content directly to Cloudflare Images. This method creates a one-time

        upload URL. Use the V2 endpoint for additional features such as custom IDs and

        metadata.

        '
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/images_image_direct_upload_request_v1'
      responses:
        '200':
          description: Create authenticated direct upload URL V1 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_image_direct_upload_response_v1'
        4XX:
          description: Create authenticated direct upload URL V1 response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_direct_upload_response_v1'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      deprecated: true
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images
      x-api-token-group:
      - Images Write
      x-fern-availability: deprecated
      x-fern-ignore: true
      x-fern-sdk-group-name: images.v1.direct-uploads
      x-fern-sdk-method-name: create
  /accounts/{account_id}/images/v1/keys:
