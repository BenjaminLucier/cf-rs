          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_key_response_collection'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images Keys
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images.keys
      x-fern-sdk-method-name: delete
      x-forge-require-confirmation: This operation will delete this signing key. This will invalidate any URLs that are signed
        with this key.
    put:
      operationId: cloudflare-images-keys-add-signing-key
      summary: Create a new Signing Key
      description: Create a new CF Images signing key with specified name. Returns all keys available.
      parameters:
      - name: signing_key_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_signing_key_identifier'
      - name: account_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/images_account_identifier'
      responses:
        '200':
          description: Add Signing Key response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/images_image_key_response_collection'
        4XX:
          description: Add Signing Key response failure
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/images_image_key_response_collection'
                - $ref: '#/components/schemas/images_api-response-common-failure'
      security:
      - api_token: []
      - api_email: []
        api_key: []
      tags:
      - Cloudflare Images Keys
      x-fern-availability: generally-available
      x-fern-sdk-group-name: images.keys
      x-fern-sdk-method-name: create
  /accounts/{account_id}/images/v1/stats:
