name: release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Opens or updates a "release" PR with version bumps and changelog entries.
  # Uses RELEASE_PLZ_TOKEN (a fine-grained PAT or GitHub App token) instead of
  # GITHUB_TOKEN so that CI runs on the PR it opens.
  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BenjaminLucier'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Publishes crates whose version isn't on crates.io yet, tags them
  # (`{package}-v{version}`) and creates GitHub releases. Uses crates.io
  # trusted publishing: no long-lived registry token is stored.
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BenjaminLucier'
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
