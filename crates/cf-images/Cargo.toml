[package]
name = "cf-images"
version = "0.1.0"
description = "Unofficial async Rust client for the Cloudflare Images API: upload, manage, and deliver images, including signed URLs."
keywords = ["cloudflare", "images", "cdn", "api", "client"]
categories = ["api-bindings", "web-programming::http-client", "multimedia::images"]
readme = "README.md"
documentation = "https://docs.rs/cf-images"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
include = ["/src", "/examples", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["rustls-tls", "signing"]
# Use rustls (via reqwest's `rustls` feature) for TLS.
rustls-tls = ["reqwest/rustls"]
# Use the platform TLS implementation (via reqwest's `native-tls` feature).
native-tls = ["reqwest/native-tls"]
# Generate signed delivery URLs for private images.
signing = ["dep:hmac", "dep:sha2", "dep:hex"]
# Emit `tracing` spans around API requests.
tracing = ["dep:tracing"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
secrecy.workspace = true
url.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "signed_url"
required-features = ["signing"]
