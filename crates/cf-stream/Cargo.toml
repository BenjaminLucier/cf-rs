[package]
name = "cf-stream"
version = "0.1.0"
description = "Unofficial async Rust client for the Cloudflare Stream API: upload, manage, and deliver videos and live streams, including signed tokens and webhook verification."
keywords = ["cloudflare", "stream", "video", "api", "client"]
categories = ["api-bindings", "web-programming::http-client", "multimedia::video"]
readme = "README.md"
documentation = "https://docs.rs/cf-stream"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
include = ["/src", "/examples", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["rustls-tls", "signing", "webhooks"]
# Use rustls (via reqwest's `rustls` feature) for TLS.
rustls-tls = ["reqwest/rustls"]
# Use the platform TLS implementation (via reqwest's `native-tls` feature).
native-tls = ["reqwest/native-tls"]
# Sign playback tokens (RS256 JWTs) offline with a Stream signing key.
signing = ["dep:ring"]
# Verify webhook signatures.
webhooks = ["dep:hmac", "dep:sha2", "dep:hex"]
# Emit `tracing` spans around API requests.
tracing = ["dep:tracing"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
secrecy.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
base64.workspace = true
ring = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "stream_signed_token"
required-features = ["signing"]

[[example]]
name = "stream_verify_webhook"
required-features = ["webhooks"]
